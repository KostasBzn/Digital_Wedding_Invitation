<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .g1 { stop-color: #efd59b; }
    .g2 { stop-color: #b88f4b; }
    .edge { stroke: #8a6529; }
    .gem { fill: #fbf6ea; stroke: #a57c3c; }
    .facet { stroke: #c9a25f; }
    .spark { fill: #c9a25f; }
    @media (prefers-color-scheme: dark) {
      .g1 { stop-color: #f6e3b4; }
      .g2 { stop-color: #cfa96a; }
      .edge { stroke: #946f33; }
      .gem { fill: #ffffff; stroke: #e6c98f; }
      .facet { stroke: #e6c98f; }
      .spark { fill: #f3dfae; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="6" y1="20" x2="58" y2="58">
      <stop offset="0" class="g1" />
      <stop offset="1" class="g2" />
    </linearGradient>
    <clipPath id="upperHalf"><rect x="0" y="0" width="64" height="38" /></clipPath>
    <g id="left">
      <circle cx="22" cy="38" r="16" stroke="url(#gold)" stroke-width="5" />
      <circle class="edge" cx="22" cy="38" r="18.5" stroke-width="1.1" />
      <circle class="edge" cx="22" cy="38" r="13.5" stroke-width="1.1" />
    </g>
  </defs>

  <!-- left ring, right ring on top of it, then the upper half of the left ring over the right again -->
  <use xlink:href="#left" href="#left" />
  <circle cx="42" cy="38" r="16" stroke="url(#gold)" stroke-width="5" />
  <circle class="edge" cx="42" cy="38" r="18.5" stroke-width="1.1" />
  <circle class="edge" cx="42" cy="38" r="13.5" stroke-width="1.1" />
  <use xlink:href="#left" href="#left" clip-path="url(#upperHalf)" />

  <!-- diamond on the right ring -->
  <path class="gem" stroke-width="1.3" stroke-linejoin="round" d="M38 8h8l3 5.5L42 22l-7-8.5Z" />
  <path class="facet" stroke-width="0.8" stroke-linecap="round" d="M35 13.5h14M38 8l2.5 5.5M46 8l-2.5 5.5M40.5 13.5 42 22M43.5 13.5 42 22" />

  <!-- sparkle -->
  <path class="spark" d="M55 4.5 56.1 8l3.4 1-3.4 1L55 13.5 53.9 10 50.5 9l3.4-1Z" />
</svg>
